assert_lefthook_installed: true

pre-commit:
  parallel: true
  jobs:
    - name: Sort package.json
      run: pnpm run sort:package
      glob: '{package.json,**/package.json}'
      stage_fixed: true

    - name: Build GraphQL Schema
      run: pnpm run build:schema
      glob: 'apps/app-backend-server/src/graphql/resolvers/**/*.ts'
      stage_fixed: true
      root: "apps/app-backend-server"

    - name: Generate Database Schema
      run: pnpm run generate:database-schema
      glob: 'definitions/database-definition/migrations/*.sql'
      stage_fixed: true
      root: "definitions/database-definition"
